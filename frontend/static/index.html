<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Divi's Verve & Vogue Concierge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root {
    --bg-dark: #0A0B10;
    --surface: #141622;
    --surface-card: #1C1E2E;
    --border: rgba(255, 255, 255, 0.08);
    --border-hover: rgba(229, 193, 88, 0.3);
    --gold: #E5C158;
    --gold-gradient: linear-gradient(135deg, #F3D375 0%, #C5A037 100%);
    --text: #F3F4F6;
    --text-muted: #9CA3AF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-dark);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  header {
    background: rgba(20, 22, 34, 0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 1rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 0.8rem;
  }
  .brand-logo {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--gold-gradient);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #0A0B10;
    font-weight: 700;
    font-size: 1.1rem;
    box-shadow: 0 0 15px rgba(229, 193, 88, 0.3);
  }
  .brand-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.2rem;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: #FFF;
  }
  .status-badge {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.8rem;
    color: var(--text-muted);
    background: rgba(255, 255, 255, 0.05);
    padding: 0.3rem 0.7rem;
    border-radius: 20px;
    border: 1px solid var(--border);
  }
  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #10B981;
    box-shadow: 0 0 8px #10B981;
  }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.2rem;
  }

  .msg {
    display: flex;
    flex-direction: column;
    max-width: 85%;
    animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user {
    align-self: flex-end;
    align-items: flex-end;
  }
  .msg.agent {
    align-self: flex-start;
    align-items: flex-start;
  }

  .bubble {
    padding: 0.9rem 1.2rem;
    border-radius: 16px;
    background: var(--surface-card);
    border: 1px solid var(--border);
    color: var(--text);
    line-height: 1.5;
    font-size: 0.95rem;
    white-space: pre-wrap;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
  }

  .msg.user .bubble {
    background: var(--gold-gradient);
    color: #0A0B10;
    font-weight: 500;
    border: none;
    border-bottom-right-radius: 4px;
    box-shadow: 0 4px 18px rgba(229, 193, 88, 0.25);
  }

  .msg.agent .bubble {
    border-bottom-left-radius: 4px;
    border-left: 3px solid var(--gold);
  }

  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    max-width: 100%;
    white-space: normal;
    box-shadow: none;
  }

  .footer-container {
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    padding: 0 1.5rem 1.2rem;
  }

  .prompts {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.65rem;
    padding-bottom: 0.9rem;
  }
  @media (max-width: 680px) {
    .prompts {
      grid-template-columns: 1fr;
      gap: 0.5rem;
    }
  }

  .chip {
    appearance: none;
    -webkit-appearance: none;
    display: flex;
    align-items: center;
    gap: 0.55rem;
    padding: 0.7rem 0.9rem;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: rgba(28, 30, 46, 0.6);
    backdrop-filter: blur(8px);
    color: #D1D5DB;
    font-family: inherit;
    font-size: 0.82rem;
    font-weight: 400;
    text-align: left;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
  }
  .chip:hover {
    background: rgba(229, 193, 88, 0.08);
    color: #FFF;
    border-color: rgba(229, 193, 88, 0.4);
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(229, 193, 88, 0.15);
  }
  .chip:active {
    transform: translateY(0);
  }

  .chip-icon {
    font-size: 1rem !important;
    color: var(--gold) !important;
    flex-shrink: 0;
  }
  .chip-text {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  @media (max-width: 680px) {
    .chip-text {
      white-space: normal;
    }
  }

  form {
    display: flex;
    gap: 0.6rem;
    background: var(--surface);
    padding: 0.5rem 0.5rem 0.5rem 1rem;
    border-radius: 28px;
    border: 1px solid var(--border);
    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    transition: border-color 0.2s;
  }
  form:focus-within {
    border-color: var(--gold);
  }

  input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: inherit;
    font-size: 0.95rem;
  }
  input::placeholder {
    color: var(--text-muted);
  }

  button {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 50%;
    background: var(--gold-gradient);
    color: #0A0B10;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 15px rgba(229, 193, 88, 0.4);
  }

  /* --- A2UI component styles (Card, Column, Row, Text, Divider, List, Image, Icon) --- */
  .a2card {
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.25rem;
    background: var(--surface-card);
    box-shadow: 0 8px 32px rgba(0,0,0,0.35);
    max-width: 100%;
    border-left: 3px solid var(--gold);
  }
  .a2card + .a2card, .a2col > .a2card { margin-top: 0.8rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.6rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.8rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.5; color: var(--text); }
  .a2text.a2-h1 { font-size: 1.6rem; font-weight: 700; font-family: 'Playfair Display', serif; color: var(--gold); }
  .a2text.a2-h2 { font-size: 1.3rem; font-weight: 700; font-family: 'Playfair Display', serif; color: var(--gold); }
  .a2text.a2-h3 { font-size: 1.15rem; font-weight: 600; color: #FFF; }
  .a2text.a2-h4 { font-size: 1rem; font-weight: 600; color: var(--gold); }
  .a2text.a2-caption { font-size: 0.85rem; color: var(--text-muted); }
  .a2divider { border: none; border-top: 1px solid var(--border); margin: 0.6rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 12px; display: block; border: 1px solid var(--border); margin-top: 0.4rem; }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.25rem; line-height: 1; vertical-align: middle; color: var(--gold); }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="brand-logo">V</div>
    <div class="brand-title">Divi's Verve & Vogue</div>
  </div>
  <div class="status-badge">
    <div class="status-dot"></div>
    AI Concierge
  </div>
</header>

<div id="log"></div>

<div class="footer-container">
  <div class="prompts">
    <button type="button" class="chip" onclick="sendPrompt('What autumn blazers are in our catalog?')">
      <span class="material-symbols-outlined chip-icon">checkroom</span>
      <span class="chip-text">What autumn blazers are in our catalog?</span>
    </button>
    <button type="button" class="chip" onclick="sendPrompt('Suggest a color palette for an emerald dress')">
      <span class="material-symbols-outlined chip-icon">palette</span>
      <span class="chip-text">Suggest a color palette for an emerald dress</span>
    </button>
    <button type="button" class="chip" onclick="sendPrompt('Generate an image of a luxury autumn coat')">
      <span class="material-symbols-outlined chip-icon">auto_awesome</span>
      <span class="chip-text">Generate an image of a luxury autumn coat</span>
    </button>
  </div>
  <form id="form">
    <input id="input" placeholder="Consult Divi's Verve & Vogue..." autocomplete="off" autofocus>
    <button type="submit">
      <span class="material-symbols-outlined" style="color:#0A0B10; font-weight:700;">arrow_upward</span>
    </button>
  </form>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function sendPrompt(text) {
  input.value = text;
  form.requestSubmit();
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const m = el("div", "msg " + who);
  const b = el("div", "bubble");
  m.appendChild(b); log.appendChild(m); log.scrollTop = log.scrollHeight;
  return b;
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * Anything else falls back to plain text (see renderReply). All text goes in via
 * textContent and image URLs are validated, so agent output can't inject HTML.
 * -------------------------------------------------------------------------- */

// A "bound value" is usually {literalString: "..."}; we only support literals.
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

// child ids of a component's props: single `child` and/or `children.explicitList`.
function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

// A2UI icon names are camelCase (locationOn); Material Symbols wants snake_case.
function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;   // missing / cycle guard
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;   // only allow safe URLs
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;   // unknown component -> skipped (text fallback covers content)
  }
}

// Render one or more A2UI messages (beginRendering + surfaceUpdate) into `container`.
// Returns true if anything was drawn.
function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {   // no valid root given -> infer un-referenced components
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

// Fallback: pull every Text value out of the messages as plain text.
function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";   // clear the "…" placeholder
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

// The proxy returns { parts: [{kind:"text",text} | {kind:"a2ui",data}] }.
form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent"); b.textContent = "…";
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
